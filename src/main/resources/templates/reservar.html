<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Confirmar turno</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; color: #1a202c; min-height: 100vh; }

        header {
            background: linear-gradient(135deg, #1a56db 0%, #0e3fa3 100%);
            color: #fff; padding: 1.2rem 2rem;
            display: flex; align-items: center; gap: 1rem;
        }
        header a { color: #fff; opacity: .8; text-decoration: none; font-size: .85rem; }
        header a:hover { opacity: 1; }
        header h1 { font-size: 1.2rem; font-weight: 700; }

        .container { max-width: 560px; margin: 2.5rem auto; padding: 0 1rem; }

        .card {
            background: #fff; border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,.08); overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #eff6ff, #dbeafe);
            padding: 1.5rem 2rem; border-bottom: 1px solid #bfdbfe;
        }
        .card-header h2 { font-size: 1.1rem; font-weight: 700; color: #1e3a8a; }
        .turno-info {
            display: flex; align-items: center; gap: 1rem; margin-top: .8rem;
        }
        .turno-info .icon { font-size: 2rem; }
        .turno-info .detalle strong { display: block; font-size: 1.05rem; color: #1e3a8a; }
        .turno-info .detalle span { font-size: .9rem; color: #374151; }

        .card-body { padding: 1.8rem 2rem; }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: .85rem; font-weight: 600; color: #374151; margin-bottom: .4rem; }
        input, textarea {
            width: 100%; padding: .65rem .9rem;
            border: 1.5px solid #d1d5db; border-radius: 8px;
            font-size: .95rem; font-family: inherit;
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus, textarea:focus {
            outline: none; border-color: #1a56db;
            box-shadow: 0 0 0 3px rgba(26,86,219,.1);
        }
        textarea { resize: vertical; min-height: 80px; }
        .required { color: #ef4444; }

        .pago-section { margin-bottom: 1.5rem; }
        .pago-section legend {
            font-size: .85rem; font-weight: 700; color: #374151;
            margin-bottom: .7rem; display: block;
        }
        .radio-group { display: flex; flex-direction: column; gap: .5rem; }
        .radio-label {
            display: flex; align-items: center; gap: .7rem;
            padding: .7rem .9rem; border-radius: 8px;
            border: 1.5px solid #e5e7eb; cursor: pointer;
            transition: border-color .15s, background .15s;
        }
        .radio-label:has(input:checked) { border-color: #1a56db; background: #eff6ff; }
        .radio-label input { width: auto; }
        .radio-label .rb-text strong { display: block; font-size: .9rem; }
        .radio-label .rb-text small { color: #6b7280; font-size: .8rem; }

        .btn-submit {
            width: 100%; padding: .85rem;
            background: linear-gradient(135deg, #1a56db, #0e3fa3);
            color: #fff; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: opacity .2s;
        }
        .btn-submit:hover { opacity: .9; }
        .btn-back {
            display: block; text-align: center; margin-top: 1rem;
            color: #6b7280; font-size: .85rem; text-decoration: none;
        }
        .btn-back:hover { color: #1a56db; }

        /* Chip usuario Google */
        .google-chip {
            display: flex; align-items: center; gap: .7rem;
            background: #f0fdf4; border: 1.5px solid #86efac;
            border-radius: 10px; padding: .7rem 1rem; margin-bottom: 1.3rem;
        }
        .google-chip img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .google-chip .chip-text strong { display: block; font-size: .9rem; color: #15803d; }
        .google-chip .chip-text small { font-size: .78rem; color: #16a34a; }
        input[readonly] { background: #f9fafb; color: #6b7280; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <a href="/turnos">← Volver al calendario</a>
    <h1 style="margin-left:.5rem;">Completar reserva</h1>
</header>

<div class="container">
    <div class="card">
        <div class="card-header">
            <h2>Tu turno seleccionado</h2>
            <div class="turno-info">
                <div class="icon">📅</div>
                <div class="detalle">
                    <strong th:text="${fechaFormateada}">Lunes 28 de abril 2025</strong>
                    <span>Hora: <strong th:text="${hora}">10:00</strong></span>
                </div>
            </div>
        </div>

        <div class="card-body">
            <form th:action="@{/turnos/reservar}" method="post">
                <input type="hidden" name="fecha" th:value="${fecha}"/>
                <input type="hidden" name="hora" th:value="${hora}"/>

                <!-- Chip cuando el paciente está autenticado con Google -->
                <div class="google-chip" th:if="${nombreLogueado != null}">
                    <img th:if="${fotoLogueado != null}" th:src="${fotoLogueado}" alt="foto"/>
                    <div class="chip-text">
                        <strong th:text="${nombreLogueado}">María González</strong>
                        <small>✔ Conectado con Google — tus datos se completaron automáticamente</small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre completo <span class="required">*</span></label>
                    <input type="text" id="nombre" name="nombrePaciente"
                           th:value="${nombreLogueado}"
                           th:readonly="${nombreLogueado != null}"
                           placeholder="Ej: María González" required maxlength="100"/>
                </div>

                <div class="form-group">
                    <label for="email">Email <span class="required">*</span></label>
                    <input type="email" id="email" name="emailPaciente"
                           th:value="${emailLogueado}"
                           th:readonly="${emailLogueado != null}"
                           placeholder="tu@email.com" required maxlength="150"/>
                </div>

                <div class="form-group">
                    <label for="tel">Teléfono / WhatsApp</label>
                    <input type="tel" id="tel" name="telefonoPaciente"
                           placeholder="+54 9 11 XXXX XXXX" maxlength="30"/>
                </div>

                <div class="form-group">
                    <label for="motivo">Motivo de consulta</label>
                    <textarea id="motivo" name="motivo"
                              placeholder="Describí brevemente el motivo de tu visita (opcional)"
                              maxlength="500"></textarea>
                </div>

                <div class="pago-section">
                    <legend>Forma de pago</legend>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="metodoPago" value="CONSULTORIO" checked/>
                            <div class="rb-text">
                                <strong>Pagar en el consultorio</strong>
                                <small>Abonás el día de tu turno en efectivo o débito</small>
                            </div>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="metodoPago" value="TRANSFERENCIA"/>
                            <div class="rb-text">
                                <strong>Transferencia bancaria</strong>
                                <small>Te enviamos los datos por email al confirmar</small>
                            </div>
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn-submit">✅ Confirmar turno</button>
                <a href="/turnos" class="btn-back">Cancelar y volver al calendario</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
