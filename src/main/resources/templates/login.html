<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Acceso — Turnos Médicos</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .wrapper { width: 100%; max-width: 420px; }

        .card {
            background: #fff; border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden;
        }
        .card-top {
            background: linear-gradient(135deg, #1a56db, #0e3fa3);
            padding: 2rem; text-align: center; color: #fff;
        }
        .card-top .icon { font-size: 2.5rem; margin-bottom: .5rem; }
        .card-top h1 { font-size: 1.3rem; font-weight: 700; }
        .card-top p { font-size: .85rem; opacity: .85; margin-top: .3rem; }
        .card-body { padding: 2rem; }

        .alert-error { background: #fee2e2; color: #991b1b; border-radius: 8px; padding: .75rem 1rem; font-size: .85rem; margin-bottom: 1.2rem; }
        .alert-ok    { background: #d1fae5; color: #065f46; border-radius: 8px; padding: .75rem 1rem; font-size: .85rem; margin-bottom: 1.2rem; }

        /* Botón Google */
        .btn-google {
            display: flex; align-items: center; justify-content: center; gap: .75rem;
            width: 100%; padding: .75rem 1rem;
            background: #fff; color: #374151;
            border: 1.5px solid #d1d5db; border-radius: 10px;
            font-size: .95rem; font-weight: 600; cursor: pointer;
            text-decoration: none;
            transition: box-shadow .15s, border-color .15s;
            margin-bottom: 1.2rem;
        }
        .btn-google:hover { border-color: #4285F4; box-shadow: 0 2px 8px rgba(66,133,244,.2); }
        .btn-google svg { flex-shrink: 0; }

        .divider {
            display: flex; align-items: center; gap: .8rem;
            color: #9ca3af; font-size: .8rem; margin-bottom: 1.2rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: #e5e7eb;
        }

        .form-group { margin-bottom: 1.1rem; }
        label { display: block; font-size: .82rem; font-weight: 600; color: #374151; margin-bottom: .4rem; }
        input {
            width: 100%; padding: .7rem .9rem;
            border: 1.5px solid #d1d5db; border-radius: 8px;
            font-size: .95rem; transition: border-color .15s;
        }
        input:focus { outline: none; border-color: #1a56db; box-shadow: 0 0 0 3px rgba(26,86,219,.1); }

        .btn-login {
            width: 100%; padding: .82rem;
            background: linear-gradient(135deg, #1a56db, #0e3fa3);
            color: #fff; border: none; border-radius: 10px;
            font-size: .95rem; font-weight: 700; cursor: pointer;
            transition: opacity .2s;
        }
        .btn-login:hover { opacity: .9; }

        .footer-links { display: flex; justify-content: center; gap: 1.5rem; margin-top: 1.2rem; }
        .footer-links a { color: #6b7280; font-size: .82rem; text-decoration: none; }
        .footer-links a:hover { color: #1a56db; }

        /* Nota informativa */
        .info-nota {
            margin-top: 1.5rem; background: #f0f9ff; border-radius: 10px;
            padding: .9rem 1.1rem; font-size: .8rem; color: #0369a1;
            text-align: center; border: 1px solid #bae6fd;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="card-top">
            <div class="icon">⚕️</div>
            <h1>Turnos Médicos</h1>
            <p>Ingresá con tu cuenta para continuar</p>
        </div>
        <div class="card-body">

            <div th:if="${error}" class="alert-error" th:text="${error}"></div>
            <div th:if="${mensaje}" class="alert-ok" th:text="${mensaje}"></div>

            <!-- Botón Google -->
            <a href="/oauth2/authorization/google" class="btn-google">
                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Continuar con Google
            </a>

            <div class="divider">o ingresá con email (médico)</div>

            <!-- Formulario clásico (solo para el admin/médico) -->
            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="tu@email.com" required autofocus/>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required/>
                </div>
                <button type="submit" class="btn-login">Ingresar</button>
            </form>

            <div class="footer-links">
                <a href="/turnos">← Ver calendario</a>
                <a href="/turnos/mis-turnos">Mis turnos</a>
            </div>
        </div>
    </div>

    <div class="info-nota">
        💡 <strong>Pacientes:</strong> usá "Continuar con Google" para ver y gestionar tus turnos fácilmente.
    </div>
</div>
</body>
</html>
