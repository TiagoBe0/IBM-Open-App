# =====================================================
# Sistema de Turnos Médicos
# =====================================================
spring.application.name=turnos-medicos
server.port=8081
server.address=0.0.0.0

# Base de datos PostgreSQL (IBM local)
spring.datasource.url=jdbc:postgresql://localhost:5432/openappv1
spring.datasource.username=admin_openapp
spring.datasource.password=risq194201

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

# Pool de conexiones HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Subida de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mensajes de error en dev
server.error.include-message=always
server.error.include-stacktrace=never

# Circular references (Spring Boot necesidad transitoria)
spring.main.allow-circular-references=true

# Logging
logging.level.root=WARN
logging.level.com.sbs.open_app=INFO
