<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Acceso — Panel médico</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 1rem;
        }
        .card {
            background: #fff; border-radius: 20px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3); overflow: hidden;
        }
        .card-top {
            background: linear-gradient(135deg, #1a56db, #0e3fa3);
            padding: 2rem; text-align: center; color: #fff;
        }
        .card-top .icon { font-size: 2.5rem; margin-bottom: .5rem; }
        .card-top h1 { font-size: 1.3rem; font-weight: 700; }
        .card-top p { font-size: .85rem; opacity: .85; margin-top: .3rem; }
        .card-body { padding: 2rem; }

        .alert-error { background: #fee2e2; color: #991b1b; border-radius: 8px; padding: .75rem 1rem; font-size: .85rem; margin-bottom: 1rem; }
        .alert-ok { background: #d1fae5; color: #065f46; border-radius: 8px; padding: .75rem 1rem; font-size: .85rem; margin-bottom: 1rem; }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: .82rem; font-weight: 600; color: #374151; margin-bottom: .4rem; }
        input {
            width: 100%; padding: .7rem .9rem;
            border: 1.5px solid #d1d5db; border-radius: 8px;
            font-size: .95rem; transition: border-color .15s;
        }
        input:focus { outline: none; border-color: #1a56db; box-shadow: 0 0 0 3px rgba(26,86,219,.1); }

        .btn-login {
            width: 100%; padding: .85rem;
            background: linear-gradient(135deg, #1a56db, #0e3fa3);
            color: #fff; border: none; border-radius: 10px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: opacity .2s;
        }
        .btn-login:hover { opacity: .9; }

        .back-link { display: block; text-align: center; margin-top: 1.2rem; font-size: .82rem; color: #6b7280; text-decoration: none; }
        .back-link:hover { color: #1a56db; }
    </style>
</head>
<body>
<div class="card">
    <div class="card-top">
        <div class="icon">⚕️</div>
        <h1>Panel del médico</h1>
        <p>Ingresá con tus credenciales</p>
    </div>
    <div class="card-body">
        <div th:if="${error}" class="alert-error" th:text="${error}"></div>
        <div th:if="${mensaje}" class="alert-ok" th:text="${mensaje}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required autofocus/>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required/>
            </div>
            <button type="submit" class="btn-login">Ingresar al panel</button>
        </form>

        <a href="/turnos" class="back-link">← Ver calendario de turnos</a>
    </div>
</div>
</body>
</html>
