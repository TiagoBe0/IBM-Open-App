<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vista Jerárquica - Arbol-Rama-Hoja</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #0a1929 0%, #1a2942 100%);
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            color: #1a237e;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.3s;
            color: white;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .content-card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .tree-container {
            margin-top: 20px;
        }

        .arbol-item {
            background: #f8f9fa;
            border-left: 5px solid #1565c0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .arbol-header {
            display: grid;
            grid-template-columns: 60px 1fr 200px 150px;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #1565c0;
        }

        .arbol-id {
            font-weight: bold;
            font-size: 1.2em;
            color: #1565c0;
        }

        .arbol-info {
            color: #37474f;
        }

        .arbol-info strong {
            color: #1a237e;
        }

        .arbol-documento {
            text-align: center;
        }

        .arbol-actions {
            text-align: right;
        }

        .rama-container {
            margin-left: 40px;
            margin-top: 15px;
        }

        .rama-item {
            background: #e3f2fd;
            border-left: 4px solid #0d47a1;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .rama-header {
            display: grid;
            grid-template-columns: 50px 1fr 180px 130px;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #90caf9;
        }

        .rama-id {
            font-weight: bold;
            color: #0d47a1;
        }

        .hoja-container {
            margin-left: 40px;
            margin-top: 10px;
        }

        .hoja-item {
            background: #c8e6c9;
            border-left: 3px solid #2e7d32;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        .hoja-header {
            display: grid;
            grid-template-columns: 50px 1fr 180px 130px;
            gap: 12px;
            align-items: center;
        }

        .hoja-id {
            font-weight: bold;
            color: #2e7d32;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
            margin: 2px;
        }

        .badge-documento {
            background: #4caf50;
            color: white;
        }

        .badge-sin-documento {
            background: #9e9e9e;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            font-size: 0.9em;
            color: #546e7a;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.85em;
        }

        .stats-bar {
            background: #e8eaf6;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            color: #1a237e;
        }

        .stat-item strong {
            color: #1565c0;
        }

        @media (max-width: 768px) {
            .arbol-header,
            .rama-header,
            .hoja-header {
                grid-template-columns: 1fr;
                text-align: left;
            }

            .rama-container,
            .hoja-container {
                margin-left: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Vista Jerárquica: Arbol → Rama → Hoja</h1>
            <p style="color: #546e7a; margin-top: 8px;">Estructura completa con documentos asociados</p>
        </div>

        <div class="content-card">
            <div class="toolbar">
<div>
    <input type="number" 
           id="usuarioIdInput" 
           th:value="${usuarioId}" 
           readonly
           style="padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; width: 150px; background-color: #f0f0f0;">
</div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" onclick="cargarDatos()">🔄 Cargar Datos</button>
                    <button class="btn btn-success" onclick="expandirTodo()">📖 Expandir Todo</button>
                    <button class="btn btn-primary" onclick="colapsarTodo()">📕 Colapsar Todo</button>
                </div>
            </div>

            <div class="stats-bar" id="statsBar" style="display: none;">
                <div class="stat-item">
                    <strong id="totalArboles">0</strong> Árboles
                </div>
                <div class="stat-item">
                    <strong id="totalRamas">0</strong> Ramas
                </div>
                <div class="stat-item">
                    <strong id="totalHojas">0</strong> Hojas
                </div>
                <div class="stat-item">
                    <strong id="totalDocumentos">0</strong> Documentos
                </div>
            </div>

            <div id="treeContainer" class="tree-container">
                <div class="empty-state">
                    Ingresa un ID de usuario y presiona "Cargar Datos"
                </div>
            </div>
        </div>
    </div>

    <script>
            const API_URL = '/api';
            const USUARIO_ID = /*[[${usuarioId}]]*/ null;  // ← Obtener del modelo
    
        let datosCompletos = {
            arboles: [],
            ramas: [],
            hojas: []
        };
    document.addEventListener('DOMContentLoaded', () => {
        if (USUARIO_ID) {
            document.getElementById('usuarioIdInput').value = USUARIO_ID;
            cargarDatos();  // Cargar automáticamente
        }
    });
        async function cargarDatos() {
            const usuarioId = document.getElementById('usuarioIdInput').value;
            
            if (!usuarioId) {
                alert('Por favor ingresa un ID de usuario');
                return;
            }

            document.getElementById('treeContainer').innerHTML = '<div class="loading">Cargando datos...</div>';

            try {
                const responseArboles = await fetch(`${API_URL}/arbol/usuario/${usuarioId}`);
                if (!responseArboles.ok) throw new Error('Error al cargar árboles');
                
                datosCompletos.arboles = await responseArboles.json();
                datosCompletos.ramas = [];
                datosCompletos.hojas = [];

                for (const arbol of datosCompletos.arboles) {
                    const responseRamas = await fetch(`${API_URL}/rama/arbol/${arbol.id}`);
                    if (responseRamas.ok) {
                        const ramas = await responseRamas.json();
                        datosCompletos.ramas.push(...ramas);

                        for (const rama of ramas) {
                            const responseHojas = await fetch(`${API_URL}/hoja/rama/${rama.id}`);
                            if (responseHojas.ok) {
                                const hojas = await responseHojas.json();
                                datosCompletos.hojas.push(...hojas);
                            }
                        }
                    }
                }

                renderizarArbol();
                actualizarEstadisticas();

            } catch (error) {
                console.error('Error:', error);
                document.getElementById('treeContainer').innerHTML = 
                    '<div class="empty-state">Error al cargar los datos. Verifica la conexión con el servidor.</div>';
            }
        }

        function renderizarArbol() {
            const container = document.getElementById('treeContainer');
            
            if (datosCompletos.arboles.length === 0) {
                container.innerHTML = '<div class="empty-state">No hay datos disponibles para este usuario</div>';
                return;
            }

            let html = '';

            datosCompletos.arboles.forEach(arbol => {
                const ramasDelArbol = datosCompletos.ramas.filter(r => r.arbolId === arbol.id);
                const tieneDocumento = arbol.documentoId != null;

                html += `
                    <div class="arbol-item">
                        <div class="arbol-header">
                            <div class="arbol-id">🌳 ${arbol.id}</div>
                            <div class="arbol-info">
                                <strong>${arbol.a || 'Sin título'}</strong><br>
                                <small>Área: ${arbol.b || 'N/A'} | ${arbol.c || 'Sin descripción'}</small>
                            </div>
                            <div class="arbol-documento">
                                ${tieneDocumento ? 
                                    `<span class="badge badge-documento">📄 Doc ID: ${arbol.documentoId}</span>
                                     <button class="btn btn-primary btn-small" onclick="descargarDocumento('arbol', ${arbol.documentoId})">
                                         ⬇️ Descargar
                                     </button>` : 
                                    '<span class="badge badge-sin-documento">Sin documento</span>'}
                            </div>
                            <div class="arbol-actions">
                                <button class="btn btn-primary btn-small" onclick="toggleRamas(${arbol.id})">
                                    ${ramasDelArbol.length} Rama(s)
                                </button>
                            </div>
                        </div>

                        <div class="info-grid">
                            <div><strong>Valores:</strong> AF:${arbol.af || 0}, BF:${arbol.bf || 0}, CF:${arbol.cf || 0}%</div>
                            <div><strong>Estados:</strong> BA:${arbol.ba ? '✅' : '❌'}, BB:${arbol.bb ? '✅' : '❌'}, BC:${arbol.bc ? '✅' : '❌'}</div>
                            <div><strong>Fecha:</strong> ${formatearFecha(arbol.calendario)}</div>
                        </div>

                        <div class="rama-container" id="ramas-${arbol.id}" style="display: block;">
                            ${renderizarRamas(ramasDelArbol)}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderizarRamas(ramas) {
            if (ramas.length === 0) {
                return '<div class="empty-state" style="padding: 20px;">No hay ramas en este árbol</div>';
            }

            let html = '';

            ramas.forEach(rama => {
                const hojasDeRama = datosCompletos.hojas.filter(h => h.ramaId === rama.id);
                const tieneDocumento = rama.documentoId != null;

                html += `
                    <div class="rama-item">
                        <div class="rama-header">
                            <div class="rama-id">📑 ${rama.id}</div>
                            <div>
                                <strong>${rama.a || 'Sin título'}</strong><br>
                                <small>${rama.b || 'N/A'} | ${rama.c || 'Sin descripción'}</small>
                            </div>
                            <div style="text-align: center;">
                                ${tieneDocumento ? 
                                    `<span class="badge badge-documento">📄 ${rama.documentoId}</span>
                                     <button class="btn btn-primary btn-small" onclick="descargarDocumento('rama', ${rama.documentoId})">
                                         ⬇️
                                     </button>` : 
                                    '<span class="badge badge-sin-documento">Sin doc</span>'}
                            </div>
                            <div style="text-align: right;">
                                <button class="btn btn-success btn-small" onclick="toggleHojas(${rama.id})">
                                    ${hojasDeRama.length} Hoja(s)
                                </button>
                            </div>
                        </div>

                        <div class="hoja-container" id="hojas-${rama.id}" style="display: block;">
                            ${renderizarHojas(hojasDeRama)}
                        </div>
                    </div>
                `;
            });

            return html;
        }

        function renderizarHojas(hojas) {
            if (hojas.length === 0) {
                return '<div class="empty-state" style="padding: 15px; font-size: 0.9em;">No hay hojas en esta rama</div>';
            }

            let html = '';

            hojas.forEach(hoja => {
                const tieneDocumento = hoja.documentoId != null;

                html += `
                    <div class="hoja-item">
                        <div class="hoja-header">
                            <div class="hoja-id">🍃 ${hoja.id}</div>
                            <div>
                                <strong>${hoja.a || 'Sin título'}</strong><br>
                                <small>${hoja.b || 'N/A'} | ${hoja.c || 'Sin descripción'}</small>
                            </div>
                            <div style="text-align: center;">
                                ${tieneDocumento ? 
                                    `<span class="badge badge-documento">📄 ${hoja.documentoId}</span>
                                     <button class="btn btn-primary btn-small" onclick="descargarDocumento('hoja', ${hoja.documentoId})">
                                         ⬇️
                                     </button>` : 
                                    '<span class="badge badge-sin-documento">Sin doc</span>'}
                            </div>
                            <div style="text-align: right; font-size: 0.85em; color: #666;">
                                Valores: ${hoja.af || 0}/${hoja.bf || 0}/${hoja.cf || 0}%
                            </div>
                        </div>
                    </div>
                `;
            });

            return html;
        }

        function toggleRamas(arbolId) {
            const elemento = document.getElementById(`ramas-${arbolId}`);
            elemento.style.display = elemento.style.display === 'none' ? 'block' : 'none';
        }

        function toggleHojas(ramaId) {
            const elemento = document.getElementById(`hojas-${ramaId}`);
            elemento.style.display = elemento.style.display === 'none' ? 'block' : 'none';
        }

        function expandirTodo() {
            document.querySelectorAll('.rama-container, .hoja-container').forEach(el => {
                el.style.display = 'block';
            });
        }

        function colapsarTodo() {
            document.querySelectorAll('.rama-container, .hoja-container').forEach(el => {
                el.style.display = 'none';
            });
        }

        function actualizarEstadisticas() {
            const totalDocumentos = 
                datosCompletos.arboles.filter(a => a.documentoId).length +
                datosCompletos.ramas.filter(r => r.documentoId).length +
                datosCompletos.hojas.filter(h => h.documentoId).length;

            document.getElementById('totalArboles').textContent = datosCompletos.arboles.length;
            document.getElementById('totalRamas').textContent = datosCompletos.ramas.length;
            document.getElementById('totalHojas').textContent = datosCompletos.hojas.length;
            document.getElementById('totalDocumentos').textContent = totalDocumentos;
            document.getElementById('statsBar').style.display = 'flex';
        }

        function descargarDocumento(tipo, documentoId) {
            const url = `${API_URL}/${tipo}/documento/${documentoId}`;
            window.open(url, '_blank');
        }

        function formatearFecha(fecha) {
            if (!fecha) return 'N/A';
            return new Date(fecha).toLocaleDateString('es-AR');
        }
    </script>
</body>
</html>
