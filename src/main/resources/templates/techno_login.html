<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Techno-Ratio-Argentina</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 30%, #283593 60%, #3949ab 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* Efectos de fondo animados */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(63, 81, 181, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(26, 35, 126, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 40% 80%, rgba(57, 73, 171, 0.2) 0%, transparent 50%);
            animation: float 8s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }
        
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 
                0 25px 80px rgba(12, 20, 69, 0.4),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
            animation: slideDown 0.6s ease;
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 1;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .login-header {
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 50%, #283593 100%);
            color: white;
            padding: 50px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .login-header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: sparkle 10s linear infinite;
        }
        
        @keyframes sparkle {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(-30px) translateY(-30px); }
        }
        
        .login-header .logo {
            position: relative;
            z-index: 2;
        }
        
        .login-header .logo i {
            font-size: 70px;
            margin-bottom: 20px;
            animation: pulse 2s infinite, glow 3s ease-in-out infinite alternate;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes glow {
            from { 
                text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
                filter: drop-shadow(0 0 10px rgba(0, 229, 255, 0.3));
            }
            to { 
                text-shadow: 0 0 30px rgba(0, 229, 255, 0.8);
                filter: drop-shadow(0 0 20px rgba(0, 229, 255, 0.6));
            }
        }
        
        .login-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }
        
        .login-header .subtitle {
            margin: 0;
            opacity: 0.9;
            font-size: 16px;
            font-weight: 300;
            position: relative;
            z-index: 2;
            color: #00e5ff;
        }
        
        .login-header .country {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.8;
            position: relative;
            z-index: 2;
        }
        
        .login-body {
            padding: 45px 35px;
            background: rgba(255, 255, 255, 0.98);
        }
        
        .form-floating {
            margin-bottom: 25px;
        }
        
        .form-control {
            border-radius: 15px;
            border: 2px solid #e3f2fd;
            padding: 18px;
            font-size: 16px;
            transition: all 0.3s;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
        }
        
        .form-control:focus {
            border-color: #1a237e;
            box-shadow: 0 0 0 0.2rem rgba(26, 35, 126, 0.15);
            background: white;
        }
        
        .form-floating label {
            padding: 18px;
            color: #546e7a;
            font-weight: 500;
        }
        
        .input-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #1a237e;
            pointer-events: none;
            z-index: 10;
            font-size: 18px;
        }
        
        .form-check {
            margin: 25px 0;
        }
        
        .form-check-input:checked {
            background-color: #1a237e;
            border-color: #1a237e;
        }
        
        .form-check-label {
            color: #546e7a;
            font-weight: 500;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #0c1445 0%, #1a237e 50%, #283593 100%);
            border: none;
            border-radius: 15px;
            color: white;
            padding: 18px;
            font-weight: 600;
            font-size: 17px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            position: relative;
            overflow: hidden;
        }
        
        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(12, 20, 69, 0.4);
            color: white;
        }
        
        .btn-login:hover::before {
            left: 100%;
        }
        
        .btn-login:active {
            transform: translateY(-1px);
        }
        
        .alert {
            border-radius: 12px;
            margin-bottom: 25px;
            padding: 18px;
            animation: shake 0.5s;
            border: none;
        }
        
        .alert-danger {
            background: linear-gradient(135deg, #c62828 0%, #d32f2f 100%);
            color: white;
        }
        
        .alert-success {
            background: linear-gradient(135deg, #2e7d32 0%, #388e3c 100%);
            color: white;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 30px;
        }
        
        .forgot-password a {
            color: #1a237e;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        .forgot-password a:hover {
            color: #0c1445;
            text-decoration: underline;
        }
        
        .divider {
            text-align: center;
            margin: 35px 0 25px;
            position: relative;
        }
        
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #e0e0e0, transparent);
        }
        
        .divider span {
            background: rgba(255, 255, 255, 0.98);
            padding: 0 20px;
            position: relative;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }
        
        .register-link {
            text-align: center;
            padding-top: 25px;
            border-top: 1px solid #e3f2fd;
        }
        
        .register-link p {
            margin: 0;
            color: #546e7a;
            font-size: 15px;
            font-weight: 500;
        }
        
        .register-link a {
            color: #1a237e;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s;
        }
        
        .register-link a:hover {
            color: #0c1445;
            text-decoration: underline;
        }
        
        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #1a237e;
            z-index: 10;
            background: none;
            border: none;
            padding: 8px;
            font-size: 16px;
        }
        
        .password-toggle:hover {
            color: #0c1445;
        }
        
        .loading-spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .btn-login.loading .button-text {
            display: none;
        }
        
        .btn-login.loading .loading-spinner {
            display: inline-block;
        }
        
        /* Efectos adicionales para el tema electrónico */
        .music-waves {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: linear-gradient(90deg, 
                rgba(26, 35, 126, 0.1) 0%, 
                rgba(57, 73, 171, 0.2) 50%, 
                rgba(26, 35, 126, 0.1) 100%);
            z-index: -1;
            animation: wave 4s ease-in-out infinite;
        }
        
        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.2); }
        }
    </style>
</head>
<body>
    <div class="music-waves"></div>
    
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-music"></i>
                <h1>TECHNO-RATIO</h1>
                <p class="subtitle">Electronic Events & Analytics</p>
                <p class="country">🇦🇷 Argentina</p>
            </div>
        </div>
        
        <!-- Body -->
        <div class="login-body">
            <!-- Mensajes de alerta -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span th:text="${error}">Email o contraseña incorrectos</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${mensaje}">Has cerrado sesión exitosamente</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            
            <!-- Formulario de login -->
            <form th:action="@{/login}" method="POST" id="loginForm">
                <!-- Email -->
                <div class="form-floating position-relative">
                    <input type="email" 
                           class="form-control" 
                           id="email" 
                           name="email" 
                           placeholder="nombre@ejemplo.com"
                           required
                           autocomplete="email">
                    <label for="email">Correo electrónico</label>
                    <i class="fas fa-envelope input-icon"></i>
                </div>
                
                <!-- Password -->
                <div class="form-floating position-relative">
                    <input type="password" 
                           class="form-control" 
                           id="password" 
                           name="password" 
                           placeholder="Contraseña"
                           required
                           autocomplete="current-password">
                    <label for="password">Contraseña</label>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
                
                <!-- Remember me -->
                <div class="form-check">
                    <input class="form-check-input" 
                           type="checkbox" 
                           name="remember-me" 
                           id="remember">
                    <label class="form-check-label" for="remember">
                        Mantener sesión iniciada
                    </label>
                </div>
                
                <!-- Submit button -->
                <button type="submit" class="btn btn-login" id="loginButton">
                    <span class="button-text">
                        <i class="fas fa-headphones me-2"></i>Acceder al Dashboard
                    </span>
                    <div class="loading-spinner"></div>
                </button>
            </form>
            
            <!-- Forgot password -->
            <div class="forgot-password">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>
            
            <!-- Divider -->
            <div class="divider">
                <span>O</span>
            </div>
            
            <!-- Register link -->
            <div class="register-link">
                <p>¿Nuevo en Techno-Ratio?</p>
                <a th:href="@{/registro}">Crear cuenta de organizador</a>
            </div>
        </div>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
        
        // Form submission with loading state
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const button = document.getElementById('loginButton');
            button.classList.add('loading');
            button.disabled = true;
        });
        
        // Auto-hide alerts after 6 seconds
        setTimeout(function() {
            const alerts = document.querySelectorAll('.alert');
            alerts.forEach(function(alert) {
                const bsAlert = new bootstrap.Alert(alert);
                bsAlert.close();
            });
        }, 6000);
        
        // Efecto de música en el fondo (opcional)
        function createMusicEffect() {
            const header = document.querySelector('.login-header');
            
            setInterval(() => {
                const spark = document.createElement('div');
                spark.style.cssText = `
                    position: absolute;
                    width: 4px;
                    height: 4px;
                    background: rgba(0, 229, 255, 0.8);
                    border-radius: 50%;
                    left: ${Math.random() * 100}%;
                    top: ${Math.random() * 100}%;
                    animation: sparkFade 2s ease-out forwards;
                    pointer-events: none;
                `;
                
                header.appendChild(spark);
                
                setTimeout(() => {
                    spark.remove();
                }, 2000);
            }, 800);
        }
        
        // Agregar CSS para el efecto de sparks
        const style = document.createElement('style');
        style.textContent = `
            @keyframes sparkFade {
                0% {
                    opacity: 1;
                    transform: scale(1);
                }
                100% {
                    opacity: 0;
                    transform: scale(0) translateY(-20px);
                }
            }
        `;
        document.head.appendChild(style);
        
        // Iniciar efectos cuando la página carga
        document.addEventListener('DOMContentLoaded', function() {
            createMusicEffect();
        });
    </script>
</body>
</html>
